  <script>
    // Theme before first paint: the stored choice, else the system's.
    (function () {
      var t = null;
      try { t = localStorage.getItem('ac:theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
